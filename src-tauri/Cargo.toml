[package]
name = "tinypress"
version = "0.1.0"
description = "TinyPress 速压 - 本地优先的图片+视频压缩工具"
authors = ["TinyPress"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tinypress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
