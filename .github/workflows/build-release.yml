name: Build Release

# 触发：
#   - 推送 v* 标签（发布正式版，自动生成 Release 草稿）
#   - 手动触发（workflow_dispatch，调试用）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# GITHUB_TOKEN 需写权限：创建 Release 草稿并上传安装包资产
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          # macOS 构建 Universal 双架构（Intel x86_64 + Apple Silicon arm64），
          # 一个 dmg 同时支持两种 Mac
          - os: macos-latest
            bundle: dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # 下载压缩引擎二进制（ffmpeg/cjpeg/pngquant/cwebp/avifenc → src-tauri/bins/）
      # 注：单引擎失败不阻断（bins/.gitkeep 保证资源目录存在，应用运行时会如实显示引擎状态）
      - name: Fetch engine binaries
        run: node scripts/fetch-bins.mjs
        continue-on-error: true

      # macOS 引擎：fetch-bins 已支持 darwin ffmpeg（evermeet）；其余引擎用 Homebrew 装好后复制进 bins
      - name: Install engines via Homebrew (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pngquant webp jpeg-turbo libavif tesseract tesseract-lang
          mkdir -p src-tauri/bins
          BP="$(brew --prefix)"
          cp "$BP/opt/jpeg-turbo/bin/cjpeg" src-tauri/bins/ 2>/dev/null || true
          cp "$(which pngquant)" src-tauri/bins/ 2>/dev/null || true
          cp "$(which cwebp)" src-tauri/bins/ 2>/dev/null || true
          cp "$(which avifenc)" src-tauri/bins/ 2>/dev/null || true
          cp "$(which tesseract)" src-tauri/bins/ 2>/dev/null || true
          mkdir -p src-tauri/bins/tessdata
          cp "$BP/share/tessdata/eng.traineddata" src-tauri/bins/tessdata/ 2>/dev/null || true
          cp "$BP/share/tessdata/chi_sim.traineddata" src-tauri/bins/tessdata/ 2>/dev/null || true
          # ffprobe：evermeet 独立包
          curl -fsSL -o /tmp/ffprobe.zip "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip?arch=amd64"
          unzip -o /tmp/ffprobe.zip -d src-tauri/bins/
          chmod +x src-tauri/bins/ffmpeg src-tauri/bins/ffprobe src-tauri/bins/cjpeg src-tauri/bins/pngquant src-tauri/bins/cwebp src-tauri/bins/avifenc src-tauri/bins/tesseract 2>/dev/null || true
          echo "bins 内容："
          ls -la src-tauri/bins/
          src-tauri/bins/ffmpeg -version 2>&1 | head -1 || true
        continue-on-error: false

      # 引擎二进制必须存在：ffmpeg 是核心引擎，缺失直接失败（避免发布空壳安装包）
      - name: Verify engine binaries
        run: |
          ls src-tauri/bins/
          if [ -z "$(ls src-tauri/bins/ffmpeg* 2>/dev/null | head -1)" ]; then
            echo "::error::ffmpeg 缺失，安装包将是空壳"
            exit 1
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ ! -f src-tauri/bins/ffprobe ]; then
            echo "::error::ffprobe 缺失"
            exit 1
          fi

      # 官方 tauri-action：自动处理系统依赖、构建 + 打 Release 草稿
      - name: Tauri build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "TinyPress v__VERSION__"
          releaseBody: "TinyPress 自动构建。安装包内含压缩引擎二进制。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_target && format('--bundles {0} --target {1}', matrix.bundle, matrix.tauri_target) || format('--bundles {0}', matrix.bundle) }}
